<!doctype html>
<html lang="pt-BR">
<head>

<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="app.css">

<body>
<div id="app">
  <main id="view" class="view"></main>

    <button data-go="home" class="nav-b"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Início</span></button>

    <button data-go="words" class="nav-b"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Palavras</span></button>
    <button data-go="phrases" class="nav-b"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/></svg><span>Frases</span></button>
    <button data-go="questions" class="nav-b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.7-.9 1.3v.6"/><circle cx="12" cy="16.8" r=".6" fill="currentColor"/></svg><span>Perguntas</span></button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>

<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
